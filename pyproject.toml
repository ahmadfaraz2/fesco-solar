[project]
name = "fesco-solar"
version = "0.1.0"
description = "Intelligent Solar Sizing, Bill Extractor & Payback Advisor for FESCO Consumers"
readme = "README.md"
authors = [
    { name = "ahmadfaraz2", email = "ahmadfarazjanjua780@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0.0"]
pdf = ["pdfplumber>=0.10.0"]

[project.scripts]
fesco-solar = "fesco_solar.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
